base_url = "https://new.torc.art"
title = "Truth or Consequences Contemporary"
description = "art in the oasis"
compile_sass = false
minify_html = false
default_language = "en"

# No taxonomies. The template this repo was initialized from declared a
# bookshelf's worth (recommender, authorname, pubyear, rating, readstate) and
# nothing ever used them. Real ones belong here when exhibitions and artists
# become records rather than copy.

[slugify]
paths = "on"
anchors = "on"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[link_checker]
internal_level = "warn"

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[extra]
author = "Truth or Consequences Contemporary"
default_theme = "light"
twitter_card = true
# Social-card image, overridable per page or section with extra.image
default_image = "/box_prints.jpg"
