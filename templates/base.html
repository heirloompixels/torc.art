<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
    {% include "head.html" %}
</head>
<body>
    <header class="masthead">
        <a class="wordmark" href="/">
            <img src="/logo.svg" alt="Truth or Consequences Contemporary" width="72" height="72">
            <span>Truth or Consequences Contemporary</span>
        </a>
        <nav>
            <a href="/gallery/">Exhibitions</a>
            <a href="/press/">Press</a>
            <a href="/members/">Members</a>
            <a href="{{ config.extra.shop_url | safe }}">Shop</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p class="footer-address">
            {{ config.extra.address }}<br>
            <a href="mailto:{{ config.extra.email | safe }}">{{ config.extra.email }}</a>
        </p>
        <p class="footer-links">
            <a href="/">Home</a>
            <a href="/visit/">Visit</a>
            <a href="{{ config.extra.shop_url | safe }}">Shop</a>
            <a rel="me" href="{{ config.extra.instagram | safe }}">Instagram</a>
        </p>
        <p class="subtle-mono">built {{ now() | date(format="%Y-%m-%d") }}</p>
    </footer>
</body>
</html>
